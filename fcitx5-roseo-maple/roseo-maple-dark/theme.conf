# 玫枫-暗黑 / Roseo Maple Dark —— 从 Squirrel (鼠须管) 主题移植 nya~
# 颜色已从 Squirrel 的 0x(A)BBGGRR 换算为 Fcitx5 的 #RRGGBBAA
# 搭配字体: Maple Mono NF CN (安装见 fonts/ 目录)

[Metadata]
Name=roseo-maple-dark
Version=1
Author=Ported from Squirrel "Roseo Maple Dark"
Description=玫枫 Roseo Maple Dark (暗黑) - 移植自鼠须管皮肤
ScaleWithDPI=True

[InputPanel]
# 候选词/预编辑文字 (0x99ffffff -> 60% 白)
NormalColor=#ffffff99
HighlightColor=#ffffffff
HighlightBackgroundColor=#724536ff
# 高亮候选词文字 (0xffffff)
HighlightCandidateColor=#ffffffff
# 序号 (0x77ffffff) / 高亮序号 (0x5AC461 -> 嫩绿)
CandidateLabelColor=#ffffff77
HighlightCandidateLabelColor=#61c45aff
# 注释 (0x5AC461)
CandidateCommentColor=#61c45aff
HighlightCandidateCommentColor=#61c45aff
LabelTextSizeFactor=106
CommentTextSizeFactor=100
EnableBlur=False
FullWidthHighlight=True
PageButtonAlignment=Bottom

# 面板背景: 圆角 SVG, 自带 1px 描边 (border 0x444444), 纯色回退 #333333
[InputPanel/Background]
Image=background.svg
Color=#333333ff
BorderColor=#444444ff
BorderWidth=1

[InputPanel/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

# 高亮候选背景 (0x00ffffff -> 全透明白, 忠实原作: 仅靠文字变色提示选中)
[InputPanel/Highlight]
Color=#ffffff00
BorderWidth=0

[InputPanel/ContentMargin]
Left=10
Right=10
Top=8
Bottom=8

[InputPanel/TextMargin]
Left=3
Right=3
Top=2
Bottom=2

[Menu]
NormalColor=#ffffff99
HighlightCandidateColor=#ffffffff
Spacing=0

[Menu/Background]
Color=#333333ff
BorderColor=#444444ff
BorderWidth=1

[Menu/Highlight]
Color=#ffffff1a
BorderWidth=0

[Menu/Separator]
Color=#ffffff33

[Menu/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/TextMargin]
Left=8
Right=8
Top=4
Bottom=4
