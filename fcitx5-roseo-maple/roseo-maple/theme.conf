# 玫枫 / Roseo Maple —— 从 Squirrel (鼠须管) 主题移植 nya~
# 颜色已从 Squirrel 的 0x(A)BBGGRR 换算为 Fcitx5 的 #RRGGBBAA
# 搭配字体: Maple Mono NF CN (安装见 fonts/ 目录)

[Metadata]
Name=roseo-maple
Version=1
Author=Ported from Squirrel "Roseo Maple"
Description=玫枫 Roseo Maple (亮色) - 移植自鼠须管皮肤
ScaleWithDPI=True

[InputPanel]
# 候选词/预编辑文字颜色 (Squirrel candidate_text_color 0x222222)
NormalColor=#222222ff
# 预编辑高亮文字/背景 (Squirrel preedit_back_color 0x364572)
HighlightColor=#ffffffff
HighlightBackgroundColor=#724536ff
# 高亮候选词文字 (0x4F11FA -> 玫瑰红)
HighlightCandidateColor=#fa114fff
# 序号颜色 (0xaaaaaa) / 高亮序号 (0x884F11FA, alpha=0x88)
CandidateLabelColor=#aaaaaaff
HighlightCandidateLabelColor=#fa114f88
# 注释颜色 (0x5AC461 -> 嫩绿)
CandidateCommentColor=#61c45aff
HighlightCandidateCommentColor=#61c45aff
# 序号 17pt / 候选 16pt / 注释 16pt 的比例换算
LabelTextSizeFactor=106
CommentTextSizeFactor=100
EnableBlur=False
FullWidthHighlight=True
PageButtonAlignment=Bottom

# 面板背景: 圆角 SVG (对应 corner_radius=5), 纯色回退 0xF4F4F6 -> #F6F4F4
[InputPanel/Background]
Image=background.svg
Color=#f6f4f4ff
BorderColor=#f6f4f4ff
BorderWidth=0

[InputPanel/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

# 高亮候选背景: 圆角 SVG (hilited_corner_radius=5), 纯色回退 0xEDEDF9 -> #F9EDED
[InputPanel/Highlight]
Image=highlight.svg
Color=#f9ededff
BorderColor=#f9ededff
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/ContentMargin]
Left=10
Right=10
Top=8
Bottom=8

[InputPanel/TextMargin]
Left=3
Right=3
Top=2
Bottom=2

# 右键菜单, 与候选面板同色系
[Menu]
NormalColor=#222222ff
HighlightCandidateColor=#fa114fff
Spacing=0

[Menu/Background]
Color=#f6f4f4ff
BorderColor=#aaaaaaff
BorderWidth=1

[Menu/Highlight]
Color=#f9ededff
BorderWidth=0

[Menu/Separator]
Color=#aaaaaa66

[Menu/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/TextMargin]
Left=8
Right=8
Top=4
Bottom=4
