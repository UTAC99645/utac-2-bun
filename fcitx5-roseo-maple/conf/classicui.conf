# 经典用户界面 (classicui) 配置片段
# 用法: 把下面几行合并进 ~/.config/fcitx5/conf/classicui.conf (没有就整个复制过去)

# 面板字体 (Fcitx5 的字体在这里设置, 不在 theme.conf 里)
# Squirrel 原版 16~18pt 是 macOS 高分屏手感, Linux 下建议 12~14pt, 按喜好调
Font="Maple Mono NF CN 13"
MenuFont="Maple Mono NF CN 12"

# 亮/暗主题; UseDarkTheme=True 时跟随系统日夜自动切换
Theme=roseo-maple
DarkTheme=roseo-maple-dark
UseDarkTheme=False
